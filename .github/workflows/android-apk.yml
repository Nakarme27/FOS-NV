name: Validate Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "runtime/**"
      - "scripts/Test-AndroidProductContract.ps1"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: opennv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android product contract
        shell: pwsh
        run: ./scripts/Test-AndroidProductContract.ps1

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$android_home/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$android_home" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$sdkmanager"
          test -x "$sdkmanager"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download pinned Godot Mono editor
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          version='4.7.2-stable'
          archive="$RUNNER_TEMP/godot-mono.zip"
          root="$RUNNER_TEMP/godot-mono"
          expected='129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247'
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/$version/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            --output "$archive"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          godot="$(find "$root" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Cache Godot Mono export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-mono-export-templates

      - name: Install pinned Godot Mono export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-mono-export-templates.tpz"
          root="$RUNNER_TEMP/godot-mono-export-templates"
          destination="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          expected='92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d'
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz" \
            --output "$archive"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          mkdir -p "$root" "$destination"
          unzip -q "$archive" -d "$root"
          cp -a "$root/templates/." "$destination/"
          test -f "$destination/android_debug.apk"

      - name: Configure Godot Android export tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keystore="$HOME/.android/debug.keystore"
          if [ ! -f "$keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=OpenNV,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/tmp/android-apk"
          "${{ steps.godot.outputs.path }}" --headless --editor --import --quit --path runtime
          "${{ steps.godot.outputs.path }}" --headless --path runtime \
            --export-debug Android "$GITHUB_WORKSPACE/tmp/android-apk/FOS-NV-debug.apk"
          test -s "$GITHUB_WORKSPACE/tmp/android-apk/FOS-NV-debug.apk"
          unzip -l "$GITHUB_WORKSPACE/tmp/android-apk/FOS-NV-debug.apk" | grep -q 'lib/arm64-v8a/'
          ls -lh "$GITHUB_WORKSPACE/tmp/android-apk/FOS-NV-debug.apk"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FOS-NV-Android-debug
          path: tmp/android-apk/FOS-NV-debug.apk
          if-no-files-found: error
          retention-days: 7
